<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График акций | ApexCharts</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #131722;
            color: #d1d4dc;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .home-btn {
            background: #2a2e39;
            border: none;
            color: #d1d4dc;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .home-btn:hover { background: #363c4e; }
        
        .symbol-picker {
            display: inline-flex;
            align-items: center;
            position: relative;
        }
        #symbol-input {
            background: #2a2e39;
            border: 1px solid #363c4e;
            color: #d1d4dc;
            padding: 6px 30px 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            width: 260px;
            cursor: pointer;
        }
        .dropdown-arrow {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: #787b86;
            font-size: 14px;
            cursor: pointer;
            pointer-events: auto;
        }
        .dropdown-arrow:hover { color: #d1d4dc; }
        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 4px;
            max-height: 250px;
            overflow-y: auto;
            width: 100%;
            z-index: 1000;
            display: none;
            margin-top: 4px;
        }
        .dropdown-list div {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
        }
        .dropdown-list div:hover {
            background: #2a2e39;
        }
        .chart-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: 16px;
            gap: 8px;
            min-height: 0;
            height: calc(100vh - 70px);
        }
        #candle-chart {
            height: 85%;
            min-height: 0;
        }
        #volume-chart {
            height: 15%;
            min-height: 0;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e222d;
            padding: 20px;
            border-radius: 8px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="/" class="home-btn">🏠 Главная</a>
        <label>Символ</label>
        <div class="symbol-picker">
            <input type="text" id="symbol-input" placeholder="Поиск или выбор символа..." autocomplete="off">
            <button class="dropdown-arrow" id="dropdown-arrow">▼</button>
            <div id="dropdown-list" class="dropdown-list"></div>
        </div>
    </div>
    <div class="chart-container">
        <div id="candle-chart"></div>
        <div id="volume-chart"></div>
    </div>
    <div id="loading" class="loading" style="display: none;">Загрузка данных...</div>

    <script>
        let candleChart = null;
        let volumeChart = null;
        let currentSymbol = null;
        let allStocks = [];
        let filteredStocks = [];
        let isOpen = false;

        const symbolInput = document.getElementById('symbol-input');
        const dropdownList = document.getElementById('dropdown-list');
        const arrowBtn = document.getElementById('dropdown-arrow');
        const loadingDiv = document.getElementById('loading');

        function setLoading(show) { loadingDiv.style.display = show ? 'flex' : 'none'; }
        function showError(msg) { console.error(msg); alert(msg); }

        function renderDropdown() {
            if (!isOpen) return;
            if (filteredStocks.length === 0) {
                dropdownList.innerHTML = '<div style="padding:8px 12px;">Нет подходящих символов</div>';
            } else {
                dropdownList.innerHTML = filteredStocks.map(s => 
                    `<div data-symbol="${s.symbol}" data-name="${s.name}">${s.symbol} - ${s.name}</div>`
                ).join('');
                dropdownList.querySelectorAll('div[data-symbol]').forEach(div => {
                    div.addEventListener('click', () => {
                        const sym = div.dataset.symbol;
                        const name = div.dataset.name;
                        selectSymbol(sym, name);
                        closeDropdown();
                    });
                });
            }
            dropdownList.style.display = 'block';
        }

        function openDropdown() {
            if (isOpen) return;
            isOpen = true;
            filterStocks();
            renderDropdown();
        }

        function closeDropdown() {
            isOpen = false;
            dropdownList.style.display = 'none';
        }

        function toggleDropdown() {
            if (isOpen) closeDropdown();
            else openDropdown();
        }

        function selectSymbol(symbol, name) {
            currentSymbol = symbol;
            symbolInput.value = `${symbol} - ${name}`;
            loadChartData(symbol);
        }

        function filterStocks() {
            const query = symbolInput.value.toLowerCase();
            filteredStocks = allStocks.filter(s => 
                s.symbol.toLowerCase().includes(query) || 
                s.name.toLowerCase().includes(query)
            );
            if (isOpen) renderDropdown();
        }

        let debounceTimer;
        symbolInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                filterStocks();
                if (!isOpen && symbolInput.value.trim() !== '') {
                    openDropdown();
                }
            }, 200);
        });

        arrowBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        document.addEventListener('click', (e) => {
            if (!symbolInput.contains(e.target) && !arrowBtn.contains(e.target) && !dropdownList.contains(e.target)) {
                closeDropdown();
            }
        });

        async function loadStockList() {
            try {
                const response = await fetch('/api/stocks');
                const stocks = await response.json();
                allStocks = stocks;
                filteredStocks = [...allStocks];
                
                const urlParams = new URLSearchParams(window.location.search);
                const symbolParam = urlParams.get('symbol');
                if (symbolParam && allStocks.some(s => s.symbol === symbolParam)) {
                    currentSymbol = symbolParam;
                    const stock = allStocks.find(s => s.symbol === currentSymbol);
                    symbolInput.value = `${currentSymbol} - ${stock.name}`;
                    loadChartData(currentSymbol);
                } else if (allStocks.length > 0) {
                    currentSymbol = allStocks[0].symbol;
                    const stock = allStocks[0];
                    symbolInput.value = `${currentSymbol} - ${stock.name}`;
                    loadChartData(currentSymbol);
                }
            } catch (error) {
                console.error(error);
                showError('Не удалось загрузить список акций.');
            }
        }

        function transformToCandles(data) {
            return data.t.map((time, idx) => ({
                x: new Date(time * 1000),
                y: [data.o[idx], data.h[idx], data.l[idx], data.c[idx]]
            }));
        }

        function transformToVolume(data) {
            if (!data.t || data.t.length === 0) return [];
            return data.t.map((time, idx) => ({
                x: new Date(time * 1000),
                y: data.v[idx] !== undefined ? data.v[idx] : 0
            }));
        }

        async function loadChartData(symbol) {
            if (!symbol) return;
            setLoading(true);
            try {
                const to = Math.floor(Date.now() / 1000);
                const from = to - (2 * 365 * 24 * 60 * 60);
                const url = `/api/bars/${symbol}?resolution=D&from=${from}&to=${to}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (data.s === 'error') throw new Error(data.errmsg);
                if (data.s === 'no_data' || !data.t || data.t.length === 0) {
                    showError(`Нет дневных данных для ${symbol}. Сначала запустите populate_prices.py.`);
                    if (candleChart) candleChart.destroy();
                    if (volumeChart) volumeChart.destroy();
                    document.getElementById('candle-chart').innerHTML = '<div style="color:white; text-align:center; margin-top:50px;">Нет данных</div>';
                    document.getElementById('volume-chart').innerHTML = '';
                    return;
                }

                const candleData = transformToCandles(data);
                const volumeData = transformToVolume(data);

                const candleOptions = {
                    series: [{ name: `${symbol} Price`, type: 'candlestick', data: candleData }],
                    chart: {
                        type: 'candlestick',
                        height: '100%',
                        background: '#131722',
                        foreColor: '#d1d4dc',
                        toolbar: { show: true, tools: { zoom: true, zoomin: true, zoomout: true, pan: true, reset: true } },
                        zoom: { enabled: true, type: 'x' },
                        animations: { enabled: false }
                    },
                    title: { text: `${symbol} – Дневные свечи`, align: 'left', style: { color: '#d1d4dc' } },
                    xaxis: {
                        type: 'datetime',
                        labels: { style: { colors: '#d1d4dc' }, datetimeUTC: false },
                        axisBorder: { color: '#2a2e39' },
                        axisTicks: { color: '#2a2e39' }
                    },
                    yaxis: {
                        title: { text: 'Цена', style: { color: '#d1d4dc' } },
                        labels: { style: { colors: '#d1d4dc' }, formatter: (value) => value.toFixed(4) }
                    },
                    plotOptions: { candlestick: { colors: { upward: '#26a69a', downward: '#ef5350' }, wick: { useFillColor: true } } },
                    tooltip: { shared: true, y: { formatter: (val) => val.toFixed(4) } },
                    grid: { borderColor: '#2a2e39' },
                    legend: { show: false }
                };

                const volumeOptions = {
                    series: [{ name: 'Объём', type: 'column', data: volumeData }],
                    chart: {
                        type: 'column',
                        height: '100%',
                        background: '#131722',
                        foreColor: '#d1d4dc',
                        toolbar: { show: false },
                        zoom: { enabled: true, type: 'x' },
                        animations: { enabled: false }
                    },
                    xaxis: {
                        type: 'datetime',
                        labels: { style: { colors: '#d1d4dc' }, datetimeUTC: false },
                        axisBorder: { color: '#2a2e39' },
                        axisTicks: { color: '#2a2e39' }
                    },
                    yaxis: {
                        title: { text: 'Объём', style: { color: '#d1d4dc' } },
                        labels: { style: { colors: '#d1d4dc' }, formatter: (val) => {
                            if (val >= 1e6) return (val / 1e6).toFixed(1) + 'M';
                            if (val >= 1e3) return (val / 1e3).toFixed(1) + 'K';
                            return val;
                        } }
                    },
                    plotOptions: { bar: { columnWidth: '80%', borderRadius: 2 } },
                    colors: ['#2962ff'],
                    tooltip: { shared: true, y: { formatter: (val) => val.toLocaleString() } },
                    grid: { borderColor: '#2a2e39' },
                    legend: { show: false }
                };

                if (candleChart) candleChart.destroy();
                if (volumeChart) volumeChart.destroy();

                candleChart = new ApexCharts(document.querySelector("#candle-chart"), candleOptions);
                volumeChart = new ApexCharts(document.querySelector("#volume-chart"), volumeOptions);

                await candleChart.render();
                await volumeChart.render();

                // Sync zoom/pan between charts
                const syncZoom = (source, target) => {
                    source.addEventListener('zoomed', (chart, opts) => {
                        if (target) {
                            target.updateOptions({ xaxis: { min: opts.xaxis.min, max: opts.xaxis.max } });
                        }
                    });
                };
                syncZoom(candleChart, volumeChart);
                syncZoom(volumeChart, candleChart);
                
            } catch (error) {
                console.error(error);
                showError(`Ошибка загрузки данных: ${error.message}`);
            } finally {
                setLoading(false);
            }
        }

        loadStockList();
    </script>
</body>
</html>
